name: Build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        jellyfin: ["12.0.0", "12.4.0"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "10.0.404"
      - run: make test DOTNET=dotnet TEST_JELLYFIN_VERSION=${{ matrix.jellyfin }}
      - name: Package plugin and Jellyfin catalog
        if: matrix.jellyfin == '12.0.0'
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: make package DOTNET=dotnet REPOSITORY="$REPOSITORY" TAG="$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.jellyfin == '12.0.0'
        with:
          name: strm-download
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: strm-download
          path: artifacts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/*
          --verify-tag --title "STRM Download $RELEASE_TAG"
          --notes-file artifacts/NOTICE --generate-notes
