name: Build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish or repair (for example, v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        jellyfin: ["12.0.0", "12.4.0"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "10.0.404"
      - run: make test TEST_JELLYFIN_VERSION=${{ matrix.jellyfin }}
      - name: Package plugin and Jellyfin catalog
        if: matrix.jellyfin == '12.0.0'
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: make package REPOSITORY="$REPOSITORY" TAG="$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.jellyfin == '12.0.0'
        with:
          name: strm-download
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: strm-download
          path: artifacts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          assets=(artifacts/*.zip artifacts/manifest.json)
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "STRM Download $RELEASE_TAG" \
              --notes-file artifacts/NOTICE --generate-notes
          fi
